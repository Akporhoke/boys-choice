<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Winners | The Boys' Choice Awards</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.rc{margin:2rem 0;text-align:center}.rc>button{width:100%}
.win{display:flex;flex-wrap:wrap;gap:1.4rem;justify-content:center;margin:1.2rem 0}
.win figure{margin:0;width:min(230px,70vw)}.win .frame{filter:none;box-shadow:0 0 0 3px var(--gold),0 0 40px 10px rgba(255,214,120,.7)}
.win img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink)}
.win figcaption b{display:block;font:700 1.6rem "Cormorant Garamond",serif;margin-top:.6rem}
.row{display:flex;align-items:center;gap:.8rem;margin:.4rem 0;text-align:left}.row .n{flex:0 0 9rem}.t{flex:1;height:12px;border-radius:6px;background:rgba(232,207,154,.2)}.t i{display:block;height:100%;border-radius:6px;background:var(--gold)}.row b{width:2rem;text-align:right}
/* NEW: the small award description line under each category heading */
.cat-info{margin:.3rem auto 1rem;max-width:32rem;font-size:.95rem;font-style:italic;opacity:.85}
</style></head>
<body>
<div class="curtain left" aria-hidden="true"></div><div class="curtain right" aria-hidden="true"></div>
<main id="main"></main>
<script src="rate.js"></script>
<script>
const main = document.getElementById('main');
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
let timer, shown = false;

// While locked, ask the server every 15 seconds. The moment the admin reveals, the curtains open by themselves.
async function check() {
  const d = await fetch('/api/public-results').then((r) => r.json());
  if (!d.revealed) {
    const p = el('section', undefined, 'panel entry');
    p.append(el('h1', "The winners"), el('p', "Results open at the ceremony on November 30. This page opens by itself when they are revealed."));
    return main.replaceChildren(p);
  }
  if (shown) return; shown = true; clearInterval(timer);
  // NEW step 1: the public results data has no award descriptions, so read them from /api/ballot
  // (public data, no server change) and match them to categories by id.
  // If this request fails, the page simply shows no info lines.
  const infos = await fetch('/api/ballot').then((r) => r.json())
    .then((b) => Object.fromEntries(b.categories.map((c) => [c.id, c.info]))).catch(() => ({}));
  render(d, infos); document.body.classList.add('reveal', 'open');   // curtains part in front of the winners page
}

// ---- Drumroll: built from noise bursts in the browser, so no sound file is needed ----
let sound = true, ac;
const audio = () => { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
function hit(t0, dur, vol, freq) {                        // one burst of filtered noise = one drum hit
  const c = audio(), buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t0);
}
function drumroll(sec) {                                  // hits get faster and louder, then a cymbal crash
  if (!sound) return;
  try {
    const t = audio().currentTime; let x = 0, gap = 0.11;
    while (x < sec) { hit(t + x, 0.09, 0.25 + 0.35 * (x / sec), 1800); x += gap; gap = Math.max(0.035, gap * 0.955); }
    hit(t + sec, 1.3, 0.6, 5000);
  } catch {}
}

// ---- Confetti on a canvas that removes itself ----
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
  document.body.append(cv);
  const W = (cv.width = innerWidth), H = (cv.height = innerHeight), g = cv.getContext('2d');
  const cols = ['#e8cf9a', '#b3252b', '#f6ead0', '#ffd36e'];
  const bits = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 6, s: 5 + Math.random() * 6, r: Math.random() * 6,
    vr: (Math.random() - .5) * .4, c: cols[Math.random() * 4 | 0] }));
  let frame = 0;
  (function step() {
    g.clearRect(0, 0, W, H);
    for (const p of bits) {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); g.restore();
    }
    if (++frame < 200) requestAnimationFrame(step); else cv.remove();
  })();
}

// One drumroll at a time, then reveal + confetti
let busy = false;
function celebrate(show) {
  if (busy) return; busy = true;
  const secs = 2.4; drumroll(secs);
  setTimeout(() => { show(); confetti(); busy = false; }, secs * 1000);
}

function render(d, infos = {}) {                          // CHANGED: takes the id -> info map from check()
  const all = el('button', 'Reveal all winners', 'go'), snd = el('button', 'Sound: on', 'ghost'), opens = [];
  snd.onclick = () => { sound = !sound; snd.textContent = 'Sound: ' + (sound ? 'on' : 'off'); };
  const box = el('div', undefined, 'top'); box.style.cssText = 'justify-content:center;gap:1rem;flex-wrap:wrap'; box.append(all, snd);
  const list = el('div');
  for (const c of d.categories) {
    const top = c.nominees[0] ? c.nominees[0].votes : 0;
    const winners = top > 0 ? c.nominees.filter((n) => n.votes === top) : [];   // ties show every winner
    const sec = el('section', undefined, 'rc'); const body = el('div'); body.hidden = true;
    const btn = el('button', `Reveal: ${c.name}`, 'go');
    const open = () => { body.hidden = false; btn.hidden = true; }; opens.push(open);
    btn.onclick = () => { btn.textContent = 'Drumroll...'; celebrate(open); };
    body.append(el('h2', c.name));
    // NEW step 2: the award description under the heading (el() uses textContent, so it is safe). Skipped if there is none.
    if (infos[c.id]) body.append(el('p', infos[c.id], 'cat-info'));
    if (!winners.length) body.append(el('p', 'No votes in this category.'));
    else {
      const w = el('div', undefined, 'win');
      for (const n of winners) {
        const f = el('figure'), fr = el('span', undefined, 'frame'), img = el('img');
        img.src = n.photo; img.alt = n.name; fr.append(img);
        const cap = el('figcaption'); cap.append(el('b', n.name), el('span', `${n.votes} ${n.votes === 1 ? 'vote' : 'votes'}`));
        f.append(fr, cap); w.append(f);
      }
      body.append(el('p', winners.length > 1 ? 'It is a tie.' : 'The winner is'), w);
      for (const n of c.nominees) {                                              // everyone's tally
        const row = el('div', undefined, 'row'), bar = el('div', undefined, 't'), fill = el('i');
        fill.style.width = (n.votes / top * 100) + '%'; bar.append(fill);
        row.append(el('span', n.name, 'n'), bar, el('b', n.votes)); body.append(row);
      }
    }
    sec.append(btn, body); list.append(sec);
  }
  all.onclick = () => { all.textContent = 'Drumroll...'; celebrate(() => { opens.forEach((f) => f()); all.hidden = true; }); };
  const wrap = el('section'); wrap.append(el('h2', 'And the winners are'), box, list, makeRater('ceremony', 'How was the award ceremony?'));
  main.replaceChildren(wrap);
}
check(); timer = setInterval(check, 15000);
</script></body></html>
