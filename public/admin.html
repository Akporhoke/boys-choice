<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="style.css">
<style>.row{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}.row span.n{flex:0 0 9.5rem}.t{flex:1;height:14px;border-radius:7px;background:rgba(232,207,154,.2)}.t i{display:block;height:100%;border-radius:7px;background:var(--gold)}.row b{width:2.5rem;text-align:right}
.who{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid rgba(232,207,154,.25)}.who button{padding:.4rem 1rem}
.danger{border-color:#ff8a7a;color:#ffb4a8}h3{margin-top:1.8rem;color:var(--gold)}
/* quiz editor: a round "correct answer" tick next to each option box (the global input rule would stretch it, so it is reset here) */
.qrow{display:flex;align-items:center;gap:.6rem;margin:.4rem 0}.qrow input[type=radio]{flex:0 0 auto;width:1.4rem;height:1.4rem;padding:0;accent-color:#e8cf9a}</style>
</head><body><main>
<section class="panel"><h1 style="color:var(--gold)">Admin</h1>
<label for="k">Admin key</label><input id="k" type="password" autocomplete="off">
<p><button class="go" id="go" type="button" style="margin-top:1rem">Show results</button></p>
<p class="err" id="err" role="alert"></p><div id="out"></div></section></main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
// Every admin request sends the key in a header (never in the URL)
async function call(url, body) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': $('k').value, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
async function load() {
  $('err').textContent = '';
  try {
    const d = await call('/api/results');
    const out = $('out'); out.replaceChildren();
    out.append(el('p', `${d.voters} people have voted.`));

    // WHERE the votes are saved. Anything other than MongoDB is a warning, because files are wiped on every update.
    const stor = el('p', d.storage === 'mongodb' ? 'Storage: MongoDB. Updates and restarts do not lose votes.' : 'WARNING: votes are saved in files, NOT MongoDB. They will be lost on the next update. Check MONGODB_URI on Render.');
    stor.style.color = d.storage === 'mongodb' ? 'var(--gold)' : '#ffb4a8';
    // Backup: downloads every vote, setting, quiz question and feedback as one file, as an extra safety copy
    const bk = el('button', 'Download backup', 'ghost'); bk.style.marginBottom = '.6rem';
    bk.onclick = async () => {
      try {
        const data = await call('/api/admin/export'), a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        a.download = 'boyschoice-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
      } catch (e) { $('err').textContent = e.message; }
    };
    // Proof the lock is remembered: which version is running and since when. A restart changes "started" but NOT the lock; a new version locks voting.
    const srv = el('p', d.server ? `Running version ${d.server.version}, started ${new Date(d.server.startedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}. Open or locked is saved in MongoDB, so sleeping never changes it. Only an update locks voting.` : '');
    srv.style.cssText = 'font-size:.85rem;opacity:.85';
    out.append(stor, srv, bk);

    // NEW: Close / reopen voting. While closed, nobody can submit a ballot (the server refuses it).
    const state = el('p', d.closed ? 'Voting is CLOSED: no new ballots are accepted.' : 'Voting is OPEN.'); state.style.marginTop = '1.4rem';
    const cl = el('button', d.closed ? 'Reopen voting' : 'Close voting', d.closed ? 'go' : 'ghost danger');
    cl.onclick = async () => {
      if (!d.closed && !confirm('Close voting? Nobody will be able to submit a ballot until you reopen it.')) return;   // only ask before closing
      try { await call('/api/admin/close', { closed: !d.closed }); load(); } catch (e) { $('err').textContent = e.message; }
    };
    out.append(state, cl);

    // NEW: "Voting opens" date. Before this date voters can look around the ballot, but tapping a nominee only shows "Voting opens ...".
    // The date is picked in YOUR local time and saved as an exact moment; each voter sees it in their own time.
    const fmt = (iso) => new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    const opensH = el('h3', 'Voting opens');
    const opensP = el('p', d.opensAt
      ? (d.voting === 'soon' ? `Voting opens on ${fmt(d.opensAt)}. Until then voters can look around but not vote.` : `Voting opened on ${fmt(d.opensAt)}.`)
      : 'No opening date set: voting is open now.');
    const opensIn = el('input'); opensIn.type = 'datetime-local'; opensIn.setAttribute('aria-label', 'Voting opens at'); opensIn.style.colorScheme = 'dark';
    if (d.opensAt) { const t = new Date(d.opensAt); opensIn.value = new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }   // show it in local time
    const saveOpens = el('button', 'Save opening date', 'go'); saveOpens.style.marginTop = '.8rem';
    saveOpens.onclick = async () => {
      if (!opensIn.value) { $('err').textContent = 'Pick a date and time first.'; return; }
      try { await call('/api/admin/opens', { opensAt: new Date(opensIn.value).toISOString() }); load(); } catch (e) { $('err').textContent = e.message; }
    };
    out.append(opensH, opensP, opensIn, saveOpens);
    if (d.voting === 'soon') {                                    // "Open voting now" only makes sense while it is still waiting
      const openNow = el('button', 'Open voting now', 'ghost'); openNow.style.cssText = 'margin:.8rem 0 0 .6rem';
      openNow.onclick = async () => { try { await call('/api/admin/opens', { opensAt: '' }); load(); } catch (e) { $('err').textContent = e.message; } };
      out.append(openNow);
    }

    // Reveal switch for the public results page (/results.html)
    const rv = el('button', d.revealed ? 'Hide results from everyone' : 'Show results to everyone', d.revealed ? 'ghost' : 'go');
    rv.onclick = async () => { try { await call('/api/admin/reveal', { revealed: !d.revealed }); load(); } catch (e) { $('err').textContent = e.message; } };
    const rvState = el('p', d.revealed ? 'Results page is OPEN: everyone can see the winners at /results.html.' : 'Results page is LOCKED: voters see that results open on the night.');
    rvState.style.marginTop = '1.4rem';
    out.append(rvState, rv);

    // CHANGED: The Boys Quiz editor. A pool of up to 20 questions; every time someone plays, the server picks 6 of them at random.
    const qd = await call('/api/admin/quiz');                      // { questions:[{id,q,options,answer}], max:20, need:6 }
    out.append(el('h3', 'The Boys Quiz'));
    out.append(el('p', `Add up to ${qd.max} questions. Each time someone plays, ${qd.need} of them are picked at random. Tick the circle next to the correct answer. Leave an option empty to use fewer than 4 (at least 2 needed). The quiz goes live once you have at least ${qd.need} questions. Press Save quiz to keep your changes.`));
    const qList = el('div'), qBlocks = [], qCount = el('p');       // qBlocks = one record per question box on the screen
    const addQ = el('button', 'Add a question', 'ghost'); addQ.type = 'button';
    let uid = 0;                                                   // gives every box its own radio-group name
    // Renumbers the boxes ("Question 1, 2, 3...") and updates the counter. Called after every add or delete.
    const refresh = () => {
      qBlocks.forEach((b, k) => { b.lab.textContent = `Question ${k + 1}`; });
      qCount.textContent = `${qBlocks.length} of ${qd.max} questions`;
      addQ.disabled = qBlocks.length >= qd.max;
    };
    // Builds one question box: label, question field, 4 option rows (each with a round "correct" tick) and a Delete button.
    const addBlock = (x) => {
      const n = ++uid, b = { id: x.id || '', box: el('div'), lab: el('label'), qi: el('input'), opts: [] };
      b.box.style.margin = '1.2rem 0';
      b.qi.id = 'quizq' + n; b.lab.htmlFor = b.qi.id; b.qi.maxLength = 200; b.qi.value = x.q || ''; b.qi.placeholder = 'Type the question';
      b.box.append(b.lab, b.qi);
      for (let i = 0; i < 4; i++) {
        const row = el('div', undefined, 'qrow'), rad = el('input'), t = el('input');
        rad.type = 'radio'; rad.name = 'quizans' + n; rad.checked = x.answer === i;
        t.maxLength = 100; t.value = (x.options && x.options[i]) || ''; t.placeholder = `Option ${i + 1}`;
        rad.setAttribute('aria-label', `Option ${i + 1} is the correct answer`); t.setAttribute('aria-label', `Option ${i + 1}`);
        row.append(rad, t); b.box.append(row); b.opts.push({ rad, t });
      }
      const del = el('button', 'Delete this question', 'ghost danger'); del.type = 'button'; del.style.marginTop = '.4rem';
      del.onclick = () => { qBlocks.splice(qBlocks.indexOf(b), 1); b.box.remove(); refresh(); };   // removed from the screen; it is gone for good after Save quiz
      b.box.append(del); qBlocks.push(b); qList.append(b.box); refresh();
    };
    addQ.onclick = () => addBlock({});
    qd.questions.forEach(addBlock);                                // show the saved questions
    if (!qd.questions.length) addBlock({});                        // brand new quiz: start with one empty box
    const saveQ = el('button', 'Save quiz', 'go'), qMsg = el('p'); qMsg.setAttribute('role', 'status');
    saveQ.style.marginLeft = '.6rem';
    saveQ.onclick = async () => {
      qMsg.className = ''; qMsg.textContent = '';
      // answer = which round tick is chosen (-1 when none, which the server turns into a clear error message)
      const questions = qBlocks.map((b) => ({ id: b.id, q: b.qi.value, options: b.opts.map((o) => o.t.value), answer: b.opts.findIndex((o) => o.rad.checked) }));
      try {
        const r = await call('/api/admin/quiz', { questions });
        qMsg.textContent = r.ready ? `Saved ${r.count} questions. The quiz is live.` : `Saved ${r.count} questions, but not live yet: you need at least ${qd.need}.`;
      } catch (e) { qMsg.className = 'err'; qMsg.textContent = e.message; }   // shown right here, next to the button
    };
    out.append(qCount, qList, addQ, saveQ, qMsg);

    // Registered names: the admin sees WHO voted, never WHAT they picked
    out.append(el('h3', 'Registered voters'));
    if (!d.people.length) out.append(el('p', 'Nobody has voted yet.'));
    for (const p of d.people) {
      const row = el('div', undefined, 'who'); row.append(el('span', p.name));
      const b = el('button', 'Let them retake', 'ghost');
      b.onclick = async () => {
        if (!confirm(`Delete ${p.name}'s ballot so they can vote again?`)) return;
        try { await call('/api/admin/retake', { name: p.key }); load(); } catch (e) { $('err').textContent = e.message; }
      };
      row.append(b); out.append(row);
    }
    const clear = el('button', 'Clear all votes', 'ghost danger'); clear.style.marginTop = '1rem';
    clear.onclick = async () => {
      if (!confirm('Delete ALL votes? Results reset to zero and everyone can vote again. This cannot be undone.')) return;
      try { await call('/api/admin/clear', {}); load(); } catch (e) { $('err').textContent = e.message; }
    };
    out.append(clear);

    // Feedback: averages and every written note, without names
    const fb = await call('/api/admin/feedback');
    out.append(el('h3', 'Feedback'));
    for (const [t, label] of [['process', 'Nomination and voting process'], ['ceremony', 'Award ceremony']]) {
      const s = fb.summary[t];
      out.append(el('p', `${label}: ${s.count ? s.avg.toFixed(1) + ' out of 5 from ' + s.count + (s.count === 1 ? ' rating' : ' ratings') : 'no ratings yet'}`));
    }
    for (const f of fb.notes) {
      const row = el('div', undefined, 'who');
      row.append(el('span', `${f.type === 'process' ? 'Process' : 'Ceremony'}, ${f.rating}/5: ${f.note}`)); out.append(row);
    }
    const clearFb = el('button', 'Clear feedback', 'ghost danger'); clearFb.style.marginTop = '1rem';
    clearFb.onclick = async () => {
      if (!confirm('Delete all feedback ratings and notes?')) return;
      try { await call('/api/admin/feedback/clear', {}); load(); } catch (e) { $('err').textContent = e.message; }
    };
    out.append(clearFb);

    out.append(el('h3', 'Results'));
    for (const c of d.categories) {
      const h = el('h3', c.name); h.style.fontSize = '1.5rem'; out.append(h);
      const max = Math.max(1, ...c.nominees.map((n) => n.votes));
      for (const n of c.nominees) {
        const row = el('div', undefined, 'row');
        const bar = el('div', undefined, 't'), fill = el('i'); fill.style.width = (n.votes / max * 100) + '%'; bar.append(fill);
        row.append(el('span', n.name, 'n'), bar, el('b', n.votes)); out.append(row);
      }
    }
  } catch (e) { $('err').textContent = e.message; }
}
$('go').addEventListener('click', load);
</script></body></html>
