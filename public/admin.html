<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="style.css">
<style>.row{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}.row span.n{flex:0 0 9.5rem}.t{flex:1;height:14px;border-radius:7px;background:rgba(232,207,154,.2)}.t i{display:block;height:100%;border-radius:7px;background:var(--gold)}.row b{width:2.5rem;text-align:right}
.who{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid rgba(232,207,154,.25)}.who button{padding:.4rem 1rem}
.danger{border-color:#ff8a7a;color:#ffb4a8}h3{margin-top:1.8rem;color:var(--gold)}</style>
</head><body><main>
<section class="panel"><h1 style="color:var(--gold)">Admin</h1>
<label for="k">Admin key</label><input id="k" type="password" autocomplete="off">
<p><button class="go" id="go" type="button" style="margin-top:1rem">Show results</button></p>
<p class="err" id="err" role="alert"></p><div id="out"></div></section></main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
// Every admin request sends the key in a header (never in the URL)
async function call(url, body) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': $('k').value, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
async function load() {
  $('err').textContent = '';
  try {
    const d = await call('/api/results');
    const out = $('out'); out.replaceChildren();
    out.append(el('p', `${d.voters} people have voted.`));

    // Registered names: the admin sees WHO voted, never WHAT they picked
    out.append(el('h3', 'Registered voters'));
    if (!d.people.length) out.append(el('p', 'Nobody has voted yet.'));
    for (const p of d.people) {
      const row = el('div', undefined, 'who'); row.append(el('span', p.name));
      const b = el('button', 'Let them retake', 'ghost');
      b.onclick = async () => {
        if (!confirm(`Delete ${p.name}'s ballot so they can vote again?`)) return;
        try { await call('/api/admin/retake', { name: p.key }); load(); } catch (e) { $('err').textContent = e.message; }
      };
      row.append(b); out.append(row);
    }
    const clear = el('button', 'Clear all votes', 'ghost danger'); clear.style.marginTop = '1rem';
    clear.onclick = async () => {
      if (!confirm('Delete ALL votes? Results reset to zero and everyone can vote again. This cannot be undone.')) return;
      try { await call('/api/admin/clear', {}); load(); } catch (e) { $('err').textContent = e.message; }
    };
    out.append(clear);

    out.append(el('h3', 'Results'));
    for (const c of d.categories) {
      const h = el('h3', c.name); h.style.fontSize = '1.5rem'; out.append(h);
      const max = Math.max(1, ...c.nominees.map((n) => n.votes));
      for (const n of c.nominees) {
        const row = el('div', undefined, 'row');
        const bar = el('div', undefined, 't'), fill = el('i'); fill.style.width = (n.votes / max * 100) + '%'; bar.append(fill);
        row.append(el('span', n.name, 'n'), bar, el('b', n.votes)); out.append(row);
      }
    }
  } catch (e) { $('err').textContent = e.message; }
}
$('go').addEventListener('click', load);
</script></body></html>
